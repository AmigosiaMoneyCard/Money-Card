name: CI Pipeline

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

jobs:
  frontend:
    name: Frontend Tests and Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './Frontend Money Card'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Frontend Money Card/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run unit and integration tests
        run: npm test -- --run

  backend:
    name: Backend Tests and Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './Backend Money Card'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Backend Money Card/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run backend tests
        run: npm test

  mobile:
    name: Mobile POS Tests and Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './Flutter Money card'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static code analysis
        run: flutter analyze --no-pub

      - name: Run unit and widget tests
        run: flutter test
